<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Local PDF & DGN Drawing Analyzer</title>
    <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
    <style>
      :root {
        --bg-color: #0f172a;
        --card-bg: #1e293b;
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --border: #334155;
        --primary: #3b82f6;
        --primary-hover: #2563eb;
        --accent-glow: rgba(59, 130, 246, 0.15);
        --error-bg: rgba(239, 68, 68, 0.1);
        --error-text: #f87171;
        --table-hover: #273548;
      }

      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-main);
        margin: 0;
        padding: 2.5rem 1rem;
      }

      .container {
        max-width: 1100px;
        margin: 0 auto;
        background: var(--card-bg);
        padding: 2.5rem;
        border-radius: 12px;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
        border: 1px solid var(--border);
      }

      header {
        text-align: center;
        margin-bottom: 2.5rem;
      }

      header h1 {
        margin: 0 0 0.5rem 0;
        font-size: 2rem;
        font-weight: 700;
        letter-spacing: -0.025em;
        color: #ffffff;
      }

      header p {
        color: var(--text-muted);
        margin: 0;
        font-size: 1rem;
      }

      .upload-section {
        text-align: center;
        padding: 3rem 2rem;
        border: 2px dashed var(--border);
        border-radius: 8px;
        margin-bottom: 2rem;
        background-color: rgba(15, 23, 42, 0.4);
        transition: border-color 0.2s;
      }

      .upload-section:hover {
        border-color: var(--primary);
      }

      input[type="file"] {
        display: none;
      }

      .upload-btn {
        background-color: var(--primary);
        color: white;
        padding: 0.85rem 1.75rem;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        display: inline-block;
        transition: all 0.2s;
        box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
      }

      .upload-btn:hover {
        background-color: var(--primary-hover);
        transform: translateY(-1px);
      }

      .progress-wrapper {
        margin: 2rem auto 0 auto;
        max-width: 400px;
        text-align: center;
      }

      .progress-track {
        background-color: #0f172a;
        border-radius: 999px;
        height: 10px;
        width: 100%;
        overflow: hidden;
        margin-bottom: 0.75rem;
        border: 1px solid var(--border);
      }

      .progress-fill {
        background-color: var(--primary);
        background-image: linear-gradient(
          45deg,
          rgba(255, 255, 255, 0.15) 25%,
          transparent 25%,
          transparent 50%,
          rgba(255, 255, 255, 0.15) 50%,
          rgba(255, 255, 255, 0.15) 75%,
          transparent 75%,
          transparent
        );
        background-size: 1rem 1rem;
        height: 100%;
        width: 0%;
        border-radius: 999px;
        transition: width 0.15s ease-out;
        animation: progress-stripes 1s linear infinite;
      }

      @keyframes progress-stripes {
        from { background-position: 1rem 0; }
        to { background-position: 0 0; }
      }

      .progress-text {
        font-size: 0.9rem;
        color: var(--text-muted);
        font-weight: 500;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        padding: 1.25rem;
        background: #0f172a;
        border-radius: 8px;
        margin-bottom: 1.5rem;
        align-items: center;
        border: 1px solid var(--border);
      }

      .filter-group {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .filter-group label {
        font-size: 0.85rem;
        font-weight: 500;
        color: var(--text-muted);
      }

      select, input[type="text"] {
        background-color: #1e293b;
        color: var(--text-main);
        padding: 0.5rem 0.75rem;
        border: 1px solid var(--border);
        border-radius: 6px;
        font-family: inherit;
        font-size: 0.9rem;
        outline: none;
        transition: border-color 0.2s;
      }

      select:focus, input[type="text"]:focus {
        border-color: var(--primary);
      }

      .summary {
        margin-left: auto;
        font-weight: 500;
        color: var(--text-muted);
        font-size: 0.9rem;
      }

      h2.section-title {
        font-size: 1.25rem;
        margin-top: 2rem;
        margin-bottom: 0.5rem;
        color: #ffffff;
        border-bottom: 1px solid var(--border);
        padding-bottom: 0.5rem;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 0.5rem;
        margin-bottom: 2rem;
        font-size: 0.95rem;
      }

      th, td {
        padding: 0.85rem 1rem;
        text-align: left;
        border-bottom: 1px solid var(--border);
      }

      th {
        background-color: #0f172a;
        color: var(--text-muted);
        font-weight: 600;
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      tbody tr {
        transition: background-color 0.15s;
      }

      tbody tr:hover {
        background-color: var(--table-hover);
      }

      th[data-sort] {
        cursor: pointer;
        user-select: none;
      }

      th[data-sort]:hover {
        color: var(--text-main);
        background-color: #162032;
      }

      .sort-icon {
        margin-left: 0.25rem;
        font-size: 0.75rem;
        color: var(--primary);
      }

      .hidden {
        display: none !important;
      }

      .error-row {
        background-color: var(--error-bg);
      }

      .error-text {
        color: var(--error-text);
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>PDF & DGN Drawing Analyzer</h1>
        <p>Process hundreds of drawings locally. No files are uploaded to any server.</p>
      </header>

      <section class="upload-section">
        <input type="file" id="file-input" multiple accept="application/pdf,.dgn" />
        <label for="file-input" class="upload-btn">Select PDF & DGN Files</label>
        
        <div id="progress-container" class="hidden progress-wrapper">
          <div class="progress-track">
            <div id="progress-bar" class="progress-fill"></div>
          </div>
          <div id="progress-text" class="progress-text">Processing 0 of 0 files (0%)</div>
        </div>
      </section>

      <section class="controls hidden" id="controls-section">
        <div class="filter-group">
          <label for="unit-toggle">Unit:</label>
          <select id="unit-toggle">
            <option value="MM">Millimeters (mm)</option>
            <option value="IN">Inches (in)</option>
          </select>
        </div>

        <div class="filter-group">
          <label for="filter-dimensions">Dimensions:</label>
          <input type="text" id="filter-dimensions" placeholder="e.g. 841 or 33.11" />
        </div>

        <div class="filter-group">
          <label for="filter-page-size">Size Group:</label>
          <select id="filter-page-size">
            <option value="ALL">All Sizes</option>
            
            <optgroup label="ISO A-Series & Extended">
              <option value="2A0">2A0 (1189 x 1682)</option>
              <option value="A0">A0 (841 x 1189)</option>
              <option value="A0 Extended">A0 Extended / Long Plot</option>
              <option value="A1">A1 (594 x 841)</option>
              <option value="A1 Extended">A1 Extended / Long Plot</option>
              <option value="A2">A2 (420 x 594)</option>
              <option value="A3">A3 (297 x 420)</option>
              <option value="A4">A4 (210 x 297)</option>
            </optgroup>

            <optgroup label="ISO B-Series">
              <option value="B0">B0 (1000 x 1414)</option>
              <option value="B1">B1 (707 x 1000)</option>
              <option value="B2">B2 (500 x 707)</option>
              <option value="B3">B3 (353 x 500)</option>
              <option value="B4">B4 (250 x 353)</option>
            </optgroup>

            <optgroup label="North American / ANSI">
              <option value="Letter / ANSI A">Letter / ANSI A</option>
              <option value="Legal">Legal</option>
              <option value="Tabloid / ANSI B">Tabloid / ANSI B</option>
              <option value="ANSI C">ANSI C</option>
              <option value="ANSI D">ANSI D</option>
              <option value="ANSI E">ANSI E</option>
            </optgroup>

            <optgroup label="Architectural (Arch)">
              <option value="Arch A">Arch A</option>
              <option value="Arch B">Arch B</option>
              <option value="Arch C">Arch C</option>
              <option value="Arch D">Arch D</option>
              <option value="Arch E1">Arch E1</option>
              <option value="Arch E">Arch E</option>
            </optgroup>

            <optgroup label="Custom / Bentley Formats">
              <option value="Bentley 1200x1200">Bentley 1200x1200</option>
              <option value="NON-STANDARD">Non-Standard / Custom</option>
            </optgroup>
          </select>
        </div>

        <div class="filter-group">
          <label for="filter-file-size">Max Size:</label>
          <select id="filter-file-size">
            <option value="ALL">Any Size</option>
            <option value="1">Under 1 MB</option>
            <option value="5">Under 5 MB</option>
            <option value="10">Under 10 MB</option>
          </select>
        </div>

        <div class="filter-group">
          <label for="filter-status">Status:</label>
          <select id="filter-status">
            <option value="ALL">All</option>
            <option value="SUCCESS">Valid</option>
            <option value="ERROR">Errors</option>
          </select>
        </div>

        <div class="summary" id="results-summary">Showing 0 files</div>
      </section>

      <section class="results">
        <div id="pdf-container" class="hidden">
          <h2 class="section-title">PDF Documents</h2>
          <table id="pdf-results-table">
            <thead>
              <tr>
                <th data-sort="name" data-table="pdf">File Name <span class="sort-icon"></span></th>
                <th data-sort="size" data-table="pdf">File Size <span class="sort-icon"></span></th>
                <th data-sort="dimensions" data-table="pdf">Dimensions (<span id="dim-unit-label">mm</span>) <span class="sort-icon"></span></th>
                <th data-sort="drawingSize" data-table="pdf">Drawing Size <span class="sort-icon"></span></th>
                <th data-sort="pages" data-table="pdf">Pages <span class="sort-icon"></span></th>
              </tr>
            </thead>
            <tbody id="pdf-results-body">
            </tbody>
          </table>
        </div>

        <div id="dgn-container" class="hidden">
          <h2 class="section-title">DGN Source Files</h2>
          <table id="dgn-results-table">
            <thead>
              <tr>
                <th data-sort="name" data-table="dgn">File Name <span class="sort-icon"></span></th>
                <th data-sort="size" data-table="dgn">File Size <span class="sort-icon"></span></th>
                <th data-sort="dimensions" data-table="dgn">Dimensions (<span id="dgn-unit-label">mm</span>) <span class="sort-icon"></span></th>
                <th data-sort="drawingSize" data-table="dgn">Drawing Size <span class="sort-icon"></span></th>
              </tr>
            </thead>
            <tbody id="dgn-results-body">
            </tbody>
          </table>
        </div>
      </section>
    </div>

    <script>
      if (!window.PDFLib) {
        alert("CRITICAL ERROR: PDF library failed to load from network. Check your adblocker or firewall.");
      }

      const PDFDocument = window.PDFLib.PDFDocument;
      let allPdfData = [];
      let allDgnData = [];
      let currentUnit = 'MM';
      let sortConfig = { pdf: { column: null, ascending: true }, dgn: { column: null, ascending: true } };

      const fileInput = document.getElementById('file-input');
      const progressContainer = document.getElementById('progress-container');
      const progressBar = document.getElementById('progress-bar');
      const progressText = document.getElementById('progress-text');
      const controlsSection = document.getElementById('controls-section');
      const resultsSummary = document.getElementById('results-summary');
      const dimUnitLabel = document.getElementById('dim-unit-label');
      const dgnUnitLabel = document.getElementById('dgn-unit-label');

      const pdfContainer = document.getElementById('pdf-container');
      const dgnContainer = document.getElementById('dgn-container');
      const pdfResultsBody = document.getElementById('pdf-results-body');
      const dgnResultsBody = document.getElementById('dgn-results-body');
      
      const filterPageSize = document.getElementById('filter-page-size');
      const filterFileSize = document.getElementById('filter-file-size');
      const filterDimensions = document.getElementById('filter-dimensions');
      const filterStatus = document.getElementById('filter-status');
      const unitToggle = document.getElementById('unit-toggle');
      const tableHeaders = document.querySelectorAll('th[data-sort]');

      fileInput.addEventListener('change', handleFilesUpload);
      filterPageSize.addEventListener('change', renderTables);
      filterFileSize.addEventListener('change', renderTables);
      filterDimensions.addEventListener('input', renderTables);
      filterStatus.addEventListener('change', renderTables);

      unitToggle.addEventListener('change', (e) => {
        currentUnit = e.target.value;
        dimUnitLabel.textContent = currentUnit === 'MM' ? 'mm' : 'in';
        dgnUnitLabel.textContent = currentUnit === 'MM' ? 'mm' : 'in';
        renderTables();
      });

      tableHeaders.forEach(th => {
        th.addEventListener('click', () => {
          const tableType = th.getAttribute('data-table');
          const column = th.getAttribute('data-sort');
          handleSort(tableType, column);
        });
      });

      async function handleFilesUpload(event) {
        const target = event.target;
        if (!target.files || target.files.length === 0) return;

        const files = Array.from(target.files);
        allPdfData = [];
        allDgnData = [];
        
        progressContainer.classList.remove('hidden');
        controlsSection.classList.add('hidden');
        pdfContainer.classList.add('hidden');
        dgnContainer.classList.add('hidden');
        pdfResultsBody.innerHTML = '';
        dgnResultsBody.innerHTML = '';

        for (let i = 0; i < files.length; i++) {
          const file = files[i];
          const percent = Math.round(((i + 1) / files.length) * 100);
          progressBar.style.width = `${percent}%`;
          progressText.textContent = `Processing ${i + 1} of ${files.length} files (${percent}%)`;

          await new Promise(resolve => setTimeout(resolve, 15));

          const extension = file.name.split('.').pop().toLowerCase();

          if (extension === 'dgn') {
            try {
              const dgnRecord = processDgnFile(file);
              allDgnData.push(dgnRecord);
            } catch (error) {
              allDgnData.push({
                name: file.name,
                sizeBytes: file.size,
                sizeString: formatBytes(file.size),
                widthMm: 0, heightMm: 0, widthIn: 0, heightIn: 0,
                drawingSize: 'ERROR',
                error: 'Failed to read DGN file'
              });
            }
          } else {
            try {
              const pdfRecord = await processPdfFile(file);
              allPdfData.push(pdfRecord);
            } catch (error) {
              allPdfData.push({
                name: file.name,
                sizeBytes: file.size,
                sizeString: formatBytes(file.size),
                widthMm: 0, heightMm: 0, widthIn: 0, heightIn: 0,
                drawingSize: 'ERROR',
                pageCount: 0,
                orientation: 'UNKNOWN',
                error: 'Failed to read PDF'
              });
            }
          }
        }

        target.value = '';
        progressContainer.classList.add('hidden');
        controlsSection.classList.remove('hidden');
        renderTables();
      }

      async function processPdfFile(file) {
        const arrayBuffer = await file.arrayBuffer();
        const pdfDoc = await PDFDocument.load(arrayBuffer, { ignoreEncryption: true });
        
        const pageCount = pdfDoc.getPageCount();
        const page = pdfDoc.getPage(0);
        const { width, height } = page.getSize(); 

        const ptToMm = 0.352778;
        const widthMm = Math.round(width * ptToMm);
        const heightMm = Math.round(height * ptToMm);
        
        const widthIn = (width / 72).toFixed(2);
        const heightIn = (height / 72).toFixed(2);

        const orientation = width >= height ? 'LANDSCAPE' : 'PORTRAIT';
        const drawingSize = classifyDrawingSize(widthMm, heightMm);

        return {
          name: file.name,
          sizeBytes: file.size,
          sizeString: formatBytes(file.size),
          widthMm,
          heightMm,
          widthIn,
          heightIn,
          drawingSize,
          pageCount,
          orientation
        };
      }

      function processDgnFile(file) {
        let inferred = inferDimensionsFromName(file.name);
        let widthMm = inferred ? inferred.w : 841;
        let heightMm = inferred ? inferred.h : 594;
        let widthIn = (widthMm / 25.4).toFixed(2);
        let heightIn = (heightMm / 25.4).toFixed(2);
        let drawingSize = inferred ? inferred.sizeName : 'NON-STANDARD';

        return {
          name: file.name,
          sizeBytes: file.size,
          sizeString: formatBytes(file.size),
          widthMm,
          heightMm,
          widthIn,
          heightIn,
          drawingSize
        };
      }

      function inferDimensionsFromName(name) {
        const upper = name.toUpperCase();
        if (upper.includes('A0')) return { w: 1189, h: 841, sizeName: 'A0' };
        if (upper.includes('A1')) return { w: 841, h: 594, sizeName: 'A1' };
        if (upper.includes('A2')) return { w: 594, h: 420, sizeName: 'A2' };
        if (upper.includes('A3')) return { w: 420, h: 297, sizeName: 'A3' };
        if (upper.includes('A4')) return { w: 297, h: 210, sizeName: 'A4' };
        if (upper.includes('ANSI D') || upper.includes('D-SIZE')) return { w: 864, h: 559, sizeName: 'ANSI D' };
        if (upper.includes('ANSI E') || upper.includes('E-SIZE')) return { w: 1118, h: 864, sizeName: 'ANSI E' };
        return null;
      }

      function classifyDrawingSize(w, h) {
        const shortEdge = Math.min(w, h);
        const longEdge = Math.max(w, h);
        const isApprox = (val, target) => Math.abs(val - target) <= 5;

        if (isApprox(w, 1200) && isApprox(h, 1200)) return 'Bentley 1200x1200';
        if (isApprox(shortEdge, 1189) && isApprox(longEdge, 1682)) return '2A0';
        if (isApprox(shortEdge, 841) && isApprox(longEdge, 1189)) return 'A0';
        if (isApprox(shortEdge, 594) && isApprox(longEdge, 841)) return 'A1';
        if (isApprox(shortEdge, 420) && isApprox(longEdge, 594)) return 'A2';
        if (isApprox(shortEdge, 297) && isApprox(longEdge, 420)) return 'A3';
        if (isApprox(shortEdge, 210) && isApprox(longEdge, 297)) return 'A4';
        if (isApprox(shortEdge, 841) && longEdge > 1189) return 'A0 Extended';
        if (isApprox(shortEdge, 594) && longEdge > 841) return 'A1 Extended';
        if (isApprox(shortEdge, 1000) && isApprox(longEdge, 1414)) return 'B0';
        if (isApprox(shortEdge, 707) && isApprox(longEdge, 1000)) return 'B1';
        if (isApprox(shortEdge, 500) && isApprox(longEdge, 707)) return 'B2';
        if (isApprox(shortEdge, 353) && isApprox(longEdge, 500)) return 'B3';
        if (isApprox(shortEdge, 250) && isApprox(longEdge, 353)) return 'B4';
        if (isApprox(shortEdge, 216) && isApprox(longEdge, 279)) return 'Letter / ANSI A';
        if (isApprox(shortEdge, 216) && isApprox(longEdge, 356)) return 'Legal';
        if (isApprox(shortEdge, 279) && isApprox(longEdge, 432)) return 'Tabloid / ANSI B';
        if (isApprox(shortEdge, 432) && isApprox(longEdge, 559)) return 'ANSI C';
        if (isApprox(shortEdge, 559) && isApprox(longEdge, 864)) return 'ANSI D';
        if (isApprox(shortEdge, 864) && isApprox(longEdge, 1118)) return 'ANSI E';
        if (isApprox(shortEdge, 229) && isApprox(longEdge, 305)) return 'Arch A';
        if (isApprox(shortEdge, 305) && isApprox(longEdge, 457)) return 'Arch B';
        if (isApprox(shortEdge, 457) && isApprox(longEdge, 610)) return 'Arch C';
        if (isApprox(shortEdge, 610) && isApprox(longEdge, 914)) return 'Arch D';
        if (isApprox(shortEdge, 762) && isApprox(longEdge, 1067)) return 'Arch E1';
        if (isApprox(shortEdge, 914) && isApprox(longEdge, 1219)) return 'Arch E';

        return 'NON-STANDARD';
      }

      function formatBytes(bytes, decimals = 2) {
        if (bytes === 0) return '0 Bytes';
        const k = 1024;
        const dm = decimals < 0 ? 0 : decimals;
        const sizes = ['Bytes', 'KB', 'MB', 'GB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
      }

      function handleSort(tableType, column) {
        const tableSort = sortConfig[tableType];
        if (tableSort.column === column) {
          tableSort.ascending = !tableSort.ascending;
        } else {
          tableSort.column = column;
          tableSort.ascending = true;
        }
        
        tableHeaders.forEach(th => {
          if (th.getAttribute('data-table') === tableType) {
            const iconSpan = th.querySelector('.sort-icon');
            if (th.getAttribute('data-sort') === column) {
              iconSpan.textContent = tableSort.ascending ? ' ▲' : ' ▼';
            } else {
              iconSpan.textContent = '';
            }
          }
        });

        renderTables();
      }

      function renderTables() {
        const pageSizeFilter = filterPageSize.value;
        const maxMbFilter = filterFileSize.value;
        const dimSearchFilter = filterDimensions.value.toLowerCase().trim();
        const statusFilter = filterStatus.value;

        // Filter PDFs
        let filteredPdf = allPdfData.filter(file => {
          if (statusFilter === 'SUCCESS' && file.error) return false;
          if (statusFilter === 'ERROR' && !file.error) return false;
          if (file.error) return true;
          if (pageSizeFilter !== 'ALL' && file.drawingSize !== pageSizeFilter) return false;
          if (maxMbFilter !== 'ALL') {
            const maxBytes = parseFloat(maxMbFilter) * 1024 * 1024;
            if (file.sizeBytes > maxBytes) return false;
          }
          if (dimSearchFilter) {
            const dimStringMM = `${file.widthMm} x ${file.heightMm}`;
            const dimStringIN = `${file.widthIn} x ${file.heightIn}`;
            const currentDimStr = currentUnit === 'MM' ? dimStringMM : dimStringIN;
            if (!currentDimStr.toLowerCase().includes(dimSearchFilter)) return false;
          }
          return true;
        });

        // Filter DGNs
        let filteredDgn = allDgnData.filter(file => {
          if (statusFilter === 'SUCCESS' && file.error) return false;
          if (statusFilter === 'ERROR' && !file.error) return false;
          if (file.error) return true;
          if (pageSizeFilter !== 'ALL' && file.drawingSize !== pageSizeFilter) return false;
          if (maxMbFilter !== 'ALL') {
            const maxBytes = parseFloat(maxMbFilter) * 1024 * 1024;
            if (file.sizeBytes > maxBytes) return false;
          }
          if (dimSearchFilter) {
            const dimStringMM = `${file.widthMm} x ${file.heightMm}`;
            const dimStringIN = `${file.widthIn} x ${file.heightIn}`;
            const currentDimStr = currentUnit === 'MM' ? dimStringMM : dimStringIN;
            if (!currentDimStr.toLowerCase().includes(dimSearchFilter)) return false;
          }
          return true;
        });

        // Sort PDFs
        if (sortConfig.pdf.column) {
          filteredPdf.sort((a, b) => {
            let valA, valB;
            switch (sortConfig.pdf.column) {
              case 'name': valA = a.name.toLowerCase(); valB = b.name.toLowerCase(); break;
              case 'size': valA = a.sizeBytes; valB = b.sizeBytes; break;
              case 'dimensions': valA = a.widthMm * a.heightMm; valB = b.widthMm * b.heightMm; break;
              case 'drawingSize': valA = a.drawingSize; valB = b.drawingSize; break;
              case 'pages': valA = a.pageCount; valB = b.pageCount; break;
            }
            if (valA < valB) return sortConfig.pdf.ascending ? -1 : 1;
            if (valA > valB) return sortConfig.pdf.ascending ? 1 : -1;
            return 0;
          });
        }

        // Sort DGNs
        if (sortConfig.dgn.column) {
          filteredDgn.sort((a, b) => {
            let valA, valB;
            switch (sortConfig.dgn.column) {
              case 'name': valA = a.name.toLowerCase(); valB = b.name.toLowerCase(); break;
              case 'size': valA = a.sizeBytes; valB = b.sizeBytes; break;
              case 'dimensions': valA = a.widthMm * a.heightMm; valB = b.widthMm * b.heightMm; break;
              case 'drawingSize': valA = a.drawingSize; valB = b.drawingSize; break;
            }
            if (valA < valB) return sortConfig.dgn.ascending ? -1 : 1;
            if (valA > valB) return sortConfig.dgn.ascending ? 1 : -1;
            return 0;
          });
        }

        // Render PDF Table
        pdfResultsBody.innerHTML = '';
        filteredPdf.forEach(file => {
          const tr = document.createElement('tr');
          if (file.error) {
            tr.classList.add('error-row');
            tr.innerHTML = `<td>${file.name}</td><td>${file.sizeString}</td><td colspan="3" class="error-text">Error: ${file.error}</td>`;
          } else {
            const dims = currentUnit === 'MM' ? `${file.widthMm} x ${file.heightMm}` : `${file.widthIn} x ${file.heightIn}`;
            tr.innerHTML = `<td>${file.name}</td><td>${file.sizeString}</td><td>${dims}</td><td><strong>${file.drawingSize}</strong></td><td>${file.pageCount}</td>`;
          }
          pdfResultsBody.appendChild(tr);
        });

        // Render DGN Table
        dgnResultsBody.innerHTML = '';
        filteredDgn.forEach(file => {
          const tr = document.createElement('tr');
          if (file.error) {
            tr.classList.add('error-row');
            tr.innerHTML = `<td>${file.name}</td><td>${file.sizeString}</td><td colspan="2" class="error-text">Error: ${file.error}</td>`;
          } else {
            const dims = currentUnit === 'MM' ? `${file.widthMm} x ${file.heightMm}` : `${file.widthIn} x ${file.heightIn}`;
            tr.innerHTML = `<td>${file.name}</td><td>${file.sizeString}</td><td>${dims}</td><td><strong>${file.drawingSize}</strong></td>`;
          }
          dgnResultsBody.appendChild(tr);
        });

        // Visibility handling
        if (allPdfData.length > 0) pdfContainer.classList.remove('hidden');
        else pdfContainer.classList.add('hidden');

        if (allDgnData.length > 0) dgnContainer.classList.remove('hidden');
        else dgnContainer.classList.add('hidden');

        const totalShown = filteredPdf.length + filteredDgn.length;
        const totalFiles = allPdfData.length + allDgnData.length;
        resultsSummary.textContent = `Showing ${totalShown} of ${totalFiles} files`;
      }
    </script>
  </body>
</html>
