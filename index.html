<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Local PDF Drawing Analyzer</title>
    <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
    <style>
      :root {
        --bg-color: #f4f4f5;
        --card-bg: #ffffff;
        --primary: #2563eb;
        --primary-hover: #1d4ed8;
        --text-main: #1f2937;
        --text-muted: #6b7280;
        --border: #e5e7eb;
      }

      body {
        font-family: system-ui, -apple-system, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-main);
        margin: 0;
        padding: 2rem;
      }

      .container {
        max-width: 1000px;
        margin: 0 auto;
        background: var(--card-bg);
        padding: 2rem;
        border-radius: 8px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      }

      header {
        text-align: center;
        margin-bottom: 2rem;
      }

      header h1 {
        margin: 0 0 0.5rem 0;
      }

      header p {
        color: var(--text-muted);
        margin: 0;
      }

      .upload-section {
        text-align: center;
        padding: 3rem;
        border: 2px dashed var(--border);
        border-radius: 8px;
        margin-bottom: 2rem;
      }

      input[type="file"] {
        display: none;
      }

      .upload-btn {
        background-color: var(--primary);
        color: white;
        padding: 0.75rem 1.5rem;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 600;
        transition: background 0.2s;
      }

      .upload-btn:hover {
        background-color: var(--primary-hover);
      }

      .progress-wrapper {
        margin: 2rem auto 0 auto;
        max-width: 400px;
        text-align: center;
      }

      .progress-track {
        background-color: #e5e7eb;
        border-radius: 999px;
        height: 24px;
        width: 100%;
        overflow: hidden;
        margin-bottom: 0.75rem;
        box-shadow: inset 0 1px 2px rgba(0,0,0,0.1);
      }

      .progress-fill {
        background-color: var(--primary);
        background-image: linear-gradient(
          45deg,
          rgba(255, 255, 255, 0.15) 25%,
          transparent 25%,
          transparent 50%,
          rgba(255, 255, 255, 0.15) 50%,
          rgba(255, 255, 255, 0.15) 75%,
          transparent 75%,
          transparent
        );
        background-size: 1rem 1rem;
        height: 100%;
        width: 0%;
        border-radius: 999px;
        transition: width 0.2s ease-out;
        animation: progress-stripes 1s linear infinite;
      }

      @keyframes progress-stripes {
        from { background-position: 1rem 0; }
        to { background-position: 0 0; }
      }

      .progress-text {
        font-size: 0.95rem;
        color: var(--text-main);
        font-weight: 500;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 1.2rem;
        padding: 1rem;
        background: var(--bg-color);
        border-radius: 6px;
        margin-bottom: 1rem;
        align-items: center;
      }

      .filter-group {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      select, input[type="text"] {
        padding: 0.5rem;
        border: 1px solid var(--border);
        border-radius: 4px;
        font-family: inherit;
      }

      .summary {
        margin-left: auto;
        font-weight: 500;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 1rem;
      }

      th, td {
        padding: 0.75rem;
        text-align: left;
        border-bottom: 1px solid var(--border);
      }

      th {
        background-color: var(--bg-color);
        font-weight: 600;
      }

      th[data-sort] {
        cursor: pointer;
        user-select: none;
        transition: background-color 0.2s;
      }

      th[data-sort]:hover {
        background-color: #e5e7eb;
      }

      .sort-icon {
        margin-left: 0.25rem;
        font-size: 0.8rem;
        color: var(--text-muted);
      }

      .hidden {
        display: none !important;
      }

      .error-text {
        color: #dc2626;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>PDF Drawing Analyzer</h1>
        <p>Process hundreds of drawings locally. No files are uploaded to any server.</p>
      </header>

      <section class="upload-section">
        <input type="file" id="file-input" multiple accept="application/pdf" />
        <label for="file-input" class="upload-btn">Select PDF Files</label>
        
        <div id="progress-container" class="hidden progress-wrapper">
          <div class="progress-track">
            <div id="progress-bar" class="progress-fill"></div>
          </div>
          <div id="progress-text" class="progress-text">Processing 0 of 0 files (0%)</div>
        </div>
      </section>

      <section class="controls hidden" id="controls-section">
        <div class="filter-group">
          <label for="unit-toggle">Unit:</label>
          <select id="unit-toggle">
            <option value="MM">Millimeters (mm)</option>
            <option value="IN">Inches (in)</option>
          </select>
        </div>

        <div class="filter-group">
          <label for="filter-dimensions">Dimensions:</label>
          <input type="text" id="filter-dimensions" placeholder="e.g. 841 or 33.11" />
        </div>

        <div class="filter-group">
          <label for="filter-page-size">Size Group:</label>
          <select id="filter-page-size">
            <option value="ALL">All Sizes</option>
            
            <optgroup label="ISO A-Series & Extended Rolls">
              <option value="2A0">2A0 (1189 x 1682)</option>
              <option value="A0">A0 (841 x 1189)</option>
              <option value="A0 Extended">A0 Extended / Long Plot</option>
              <option value="A1">A1 (594 x 841)</option>
              <option value="A1 Extended">A1 Extended / Long Plot</option>
              <option value="A2">A2 (420 x 594)</option>
              <option value="A3">A3 (297 x 420)</option>
              <option value="A4">A4 (210 x 297)</option>
            </optgroup>

            <optgroup label="ISO B-Series">
              <option value="B0">B0 (1000 x 1414)</option>
              <option value="B1">B1 (707 x 1000)</option>
              <option value="B2">B2 (500 x 707)</option>
              <option value="B3">B3 (353 x 500)</option>
              <option value="B4">B4 (250 x 353)</option>
            </optgroup>

            <optgroup label="North American / ANSI">
              <option value="Letter / ANSI A">Letter / ANSI A</option>
              <option value="Legal">Legal</option>
              <option value="Tabloid / ANSI B">Tabloid / ANSI B</option>
              <option value="ANSI C">ANSI C</option>
              <option value="ANSI D">ANSI D</option>
              <option value="ANSI E">ANSI E</option>
            </optgroup>

            <optgroup label="Architectural (Arch)">
              <option value="Arch A">Arch A</option>
              <option value="Arch B">Arch B</option>
              <option value="Arch C">Arch C</option>
              <option value="Arch D">Arch D</option>
              <option value="Arch E1">Arch E1</option>
              <option value="Arch E">Arch E</option>
            </optgroup>

            <optgroup label="Custom / Bentley Formats">
              <option value="Bentley 1200x1200">Bentley 1200x1200</option>
              <option value="NON-STANDARD">Non-Standard / Custom</option>
            </optgroup>
          </select>
        </div>

        <div class="filter-group">
          <label for="filter-file-size">Max File Size:</label>
          <select id="filter-file-size">
            <option value="ALL">Any Size</option>
            <option value="1">Under 1 MB</option>
            <option value="5">Under 5 MB</option>
            <option value="10">Under 10 MB</option>
          </select>
        </div>

        <div class="filter-group">
          <label for="filter-page-count">Pages:</label>
          <select id="filter-page-count">
            <option value="ALL">All Counts</option>
            <option value="1">1 Page Only</option>
            <option value="MULTI">Multi-Page (&gt;1)</option>
          </select>
        </div>

        <div class="filter-group">
          <label for="filter-orientation">Orientation:</label>
          <select id="filter-orientation">
            <option value="ALL">All Orientations</option>
            <option value="LANDSCAPE">Landscape</option>
            <option value="PORTRAIT">Portrait</option>
          </select>
        </div>

        <div class="filter-group">
          <label for="filter-status">Status:</label>
          <select id="filter-status">
            <option value="ALL">All Files</option>
            <option value="SUCCESS">Valid Only</option>
            <option value="ERROR">Errors Only</option>
          </select>
        </div>

        <div class="summary" id="results-summary">Showing 0 files</div>
      </section>

      <section class="results">
        <table id="results-table" class="hidden">
          <thead>
            <tr>
              <th data-sort="name">File Name <span class="sort-icon"></span></th>
              <th data-sort="size">File Size <span class="sort-icon"></span></th>
              <th data-sort="dimensions">Dimensions (<span id="dim-unit-label">mm</span>) <span class="sort-icon"></span></th>
              <th data-sort="drawingSize">Drawing Size <span class="sort-icon"></span></th>
              <th data-sort="pages">Pages <span class="sort-icon"></span></th>
            </tr>
          </thead>
          <tbody id="results-body">
          </tbody>
        </table>
      </section>
    </div>

    <script>
      if (!window.PDFLib) {
        alert("CRITICAL ERROR: PDF library failed to load from network. Check your adblocker or firewall.");
      }

      const PDFDocument = window.PDFLib.PDFDocument;
      let allFilesData = [];
      let currentUnit = 'MM';
      let sortConfig = { column: null, ascending: true };

      const fileInput = document.getElementById('file-input');
      const progressContainer = document.getElementById('progress-container');
      const progressBar = document.getElementById('progress-bar');
      const progressText = document.getElementById('progress-text');
      const controlsSection = document.getElementById('controls-section');
      const resultsTable = document.getElementById('results-table');
      const resultsBody = document.getElementById('results-body');
      const resultsSummary = document.getElementById('results-summary');
      const dimUnitLabel = document.getElementById('dim-unit-label');
      
      const filterPageSize = document.getElementById('filter-page-size');
      const filterFileSize = document.getElementById('filter-file-size');
      const filterDimensions = document.getElementById('filter-dimensions');
      const filterPageCount = document.getElementById('filter-page-count');
      const filterOrientation = document.getElementById('filter-orientation');
      const filterStatus = document.getElementById('filter-status');
      const unitToggle = document.getElementById('unit-toggle');
      const tableHeaders = document.querySelectorAll('th[data-sort]');

      fileInput.addEventListener('change', handleFilesUpload);
      filterPageSize.addEventListener('change', renderTable);
      filterFileSize.addEventListener('change', renderTable);
      filterDimensions.addEventListener('input', renderTable);
      filterPageCount.addEventListener('change', renderTable);
      filterOrientation.addEventListener('change', renderTable);
      filterStatus.addEventListener('change', renderTable);

      unitToggle.addEventListener('change', (e) => {
        currentUnit = e.target.value;
        dimUnitLabel.textContent = currentUnit === 'MM' ? 'mm' : 'in';
        renderTable();
      });

      tableHeaders.forEach(th => {
        th.addEventListener('click', () => handleSort(th.getAttribute('data-sort')));
      });

      async function handleFilesUpload(event) {
        const target = event.target;
        if (!target.files || target.files.length === 0) return;

        const files = Array.from(target.files);
        allFilesData = [];
        
        progressContainer.classList.remove('hidden');
        controlsSection.classList.add('hidden');
        resultsTable.classList.add('hidden');
        resultsBody.innerHTML = '';

        for (let i = 0; i < files.length; i++) {
          const file = files[i];
          
          const percent = Math.round(((i + 1) / files.length) * 100);
          progressBar.style.width = `${percent}%`;
          progressText.textContent = `Processing ${i + 1} of ${files.length} files (${percent}%)`;

          await new Promise(resolve => setTimeout(resolve, 15));

          try {
            const data = await processSinglePdf(file);
            allFilesData.push(data);
          } catch (error) {
            console.error(`Error reading ${file.name}:`, error);
            allFilesData.push({
              name: file.name,
              sizeBytes: file.size,
              sizeString: formatBytes(file.size),
              widthMm: 0, heightMm: 0,
              widthIn: 0, heightIn: 0,
              drawingSize: 'ERROR',
              pageCount: 0,
              orientation: 'UNKNOWN',
              error: 'Failed to read PDF'
            });
          }
        }

        target.value = '';
        progressContainer.classList.add('hidden');
        controlsSection.classList.remove('hidden');
        resultsTable.classList.remove('hidden');
        renderTable();
      }

      async function processSinglePdf(file) {
        const arrayBuffer = await file.arrayBuffer();
        const pdfDoc = await PDFDocument.load(arrayBuffer, { ignoreEncryption: true });
        
        const pageCount = pdfDoc.getPageCount();
        const page = pdfDoc.getPage(0);
        const { width, height } = page.getSize(); 

        const ptToMm = 0.352778;
        const widthMm = Math.round(width * ptToMm);
        const heightMm = Math.round(height * ptToMm);
        
        const widthIn = (width / 72).toFixed(2);
        const heightIn = (height / 72).toFixed(2);

        const orientation = width >= height ? 'LANDSCAPE' : 'PORTRAIT';
        const drawingSize = classifyDrawingSize(widthMm, heightMm);

        return {
          name: file.name,
          sizeBytes: file.size,
          sizeString: formatBytes(file.size),
          widthMm,
          heightMm,
          widthIn,
          heightIn,
          drawingSize,
          pageCount,
          orientation
        };
      }

      function classifyDrawingSize(w, h) {
        const shortEdge = Math.min(w, h);
        const longEdge = Math.max(w, h);
        const isApprox = (val, target) => Math.abs(val - target) <= 5;

        if (isApprox(w, 1200) && isApprox(h, 1200)) return 'Bentley 1200x1200';

        if (isApprox(shortEdge, 1189) && isApprox(longEdge, 1682)) return '2A0';
        if (isApprox(shortEdge, 841) && isApprox(longEdge, 1189)) return 'A0';
        if (isApprox(shortEdge, 594) && isApprox(longEdge, 841)) return 'A1';
        if (isApprox(shortEdge, 420) && isApprox(longEdge, 594)) return 'A2';
        if (isApprox(shortEdge, 297) && isApprox(longEdge, 420)) return 'A3';
        if (isApprox(shortEdge, 210) && isApprox(longEdge, 297)) return 'A4';

        if (isApprox(shortEdge, 841) && longEdge > 1189) return 'A0 Extended';
        if (isApprox(shortEdge, 594) && longEdge > 841) return 'A1 Extended';

        if (isApprox(shortEdge, 1000) && isApprox(longEdge, 1414)) return 'B0';
        if (isApprox(shortEdge, 707) && isApprox(longEdge, 1000)) return 'B1';
        if (isApprox(shortEdge, 500) && isApprox(longEdge, 707)) return 'B2';
        if (isApprox(shortEdge, 353) && isApprox(longEdge, 500)) return 'B3';
        if (isApprox(shortEdge, 250) && isApprox(longEdge, 353)) return 'B4';

        if (isApprox(shortEdge, 216) && isApprox(longEdge, 279)) return 'Letter / ANSI A';
        if (isApprox(shortEdge, 216) && isApprox(longEdge, 356)) return 'Legal';
        if (isApprox(shortEdge, 279) && isApprox(longEdge, 432)) return 'Tabloid / ANSI B';
        if (isApprox(shortEdge, 432) && isApprox(longEdge, 559)) return 'ANSI C';
        if (isApprox(shortEdge, 559) && isApprox(longEdge, 864)) return 'ANSI D';
        if (isApprox(shortEdge, 864) && isApprox(longEdge, 1118)) return 'ANSI E';

        if (isApprox(shortEdge, 229) && isApprox(longEdge, 305)) return 'Arch A';
        if (isApprox(shortEdge, 305) && isApprox(longEdge, 457)) return 'Arch B';
        if (isApprox(shortEdge, 457) && isApprox(longEdge, 610)) return 'Arch C';
        if (isApprox(shortEdge, 610) && isApprox(longEdge, 914)) return 'Arch D';
        if (isApprox(shortEdge, 762) && isApprox(longEdge, 1067)) return 'Arch E1';
        if (isApprox(shortEdge, 914) && isApprox(longEdge, 1219)) return 'Arch E';

        return 'NON-STANDARD';
      }

      function formatBytes(bytes, decimals = 2) {
        if (bytes === 0) return '0 Bytes';
        const k = 1024;
        const dm = decimals < 0 ? 0 : decimals;
        const sizes = ['Bytes', 'KB', 'MB', 'GB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
      }

      function handleSort(column) {
        if (sortConfig.column === column) {
          sortConfig.ascending = !sortConfig.ascending;
        } else {
          sortConfig.column = column;
          sortConfig.ascending = true;
        }
        
        tableHeaders.forEach(th => {
          const iconSpan = th.querySelector('.sort-icon');
          if (th.getAttribute('data-sort') === column) {
            iconSpan.textContent = sortConfig.ascending ? ' ▲' : ' ▼';
          } else {
            iconSpan.textContent = '';
          }
        });

        renderTable();
      }

      function renderTable() {
        const pageSizeFilter = filterPageSize.value;
        const maxMbFilter = filterFileSize.value;
        const dimSearchFilter = filterDimensions.value.toLowerCase().trim();
        const pageCountFilter = filterPageCount.value;
        const orientationFilter = filterOrientation.value;
        const statusFilter = filterStatus.value;

        let filteredData = allFilesData.filter(file => {
          // Status filter
          if (statusFilter === 'SUCCESS' && file.error) return false;
          if (statusFilter === 'ERROR' && !file.error) return false;

          if (file.error) return true; // Keep errors visible if 'All' or 'Errors Only' selected

          if (pageSizeFilter !== 'ALL' && file.drawingSize !== pageSizeFilter) return false;
          
          if (maxMbFilter !== 'ALL') {
            const maxBytes = parseFloat(maxMbFilter) * 1024 * 1024;
            if (file.sizeBytes > maxBytes) return false;
          }

          if (pageCountFilter === '1' && file.pageCount !== 1) return false;
          if (pageCountFilter === 'MULTI' && file.pageCount <= 1) return false;

          if (orientationFilter !== 'ALL' && file.orientation !== orientationFilter) return false;

          if (dimSearchFilter) {
            const dimStringMM = `${file.widthMm} x ${file.heightMm}`;
            const dimStringIN = `${file.widthIn} x ${file.heightIn}`;
            const currentDimStr = currentUnit === 'MM' ? dimStringMM : dimStringIN;
            
            if (!currentDimStr.toLowerCase().includes(dimSearchFilter)) return false;
          }

          return true;
        });

        if (sortConfig.column) {
          filteredData.sort((a, b) => {
            let valA, valB;

            switch (sortConfig.column) {
              case 'name':
                valA = a.name.toLowerCase();
                valB = b.name.toLowerCase();
                break;
              case 'size':
                valA = a.sizeBytes;
                valB = b.sizeBytes;
                break;
              case 'dimensions':
                valA = a.widthMm * a.heightMm; 
                valB = b.widthMm * b.heightMm;
                break;
              case 'drawingSize':
                valA = a.drawingSize;
                valB = b.drawingSize;
                break;
              case 'pages':
                valA = a.pageCount;
                valB = b.pageCount;
                break;
            }

            if (valA < valB) return sortConfig.ascending ? -1 : 1;
            if (valA > valB) return sortConfig.ascending ? 1 : -1;
            return 0;
          });
        }

        resultsBody.innerHTML = '';

        filteredData.forEach(file => {
          const tr = document.createElement('tr');
          
          if (file.error) {
            tr.innerHTML = `
              <td>${file.name}</td>
              <td>${file.sizeString}</td>
              <td colspan="3" class="error-text">Error: ${file.error}</td>
            `;
          } else {
            const dims = currentUnit === 'MM' 
              ? `${file.widthMm} x ${file.heightMm}`
              : `${file.widthIn} x ${file.heightIn}`;

            tr.innerHTML = `
              <td>${file.name}</td>
              <td>${file.sizeString}</td>
              <td>${dims}</td>
              <td><strong>${file.drawingSize}</strong></td>
              <td>${file.pageCount}</td>
            `;
          }
          resultsBody.appendChild(tr);
        });

        resultsSummary.textContent = `Showing ${filteredData.length} of ${allFilesData.length} files`;
      }
    </script>
  </body>
</html>
