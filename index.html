<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Local PDF Drawing Analyzer</title>
    <style>
      :root {
        --bg-color: #f4f4f5;
        --card-bg: #ffffff;
        --primary: #2563eb;
        --primary-hover: #1d4ed8;
        --text-main: #1f2937;
        --text-muted: #6b7280;
        --border: #e5e7eb;
      }

      body {
        font-family: system-ui, -apple-system, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-main);
        margin: 0;
        padding: 2rem;
      }

      .container {
        max-width: 1000px;
        margin: 0 auto;
        background: var(--card-bg);
        padding: 2rem;
        border-radius: 8px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      }

      header {
        text-align: center;
        margin-bottom: 2rem;
      }

      header h1 {
        margin: 0 0 0.5rem 0;
      }

      header p {
        color: var(--text-muted);
        margin: 0;
      }

      .upload-section {
        text-align: center;
        padding: 3rem;
        border: 2px dashed var(--border);
        border-radius: 8px;
        margin-bottom: 2rem;
      }

      input[type="file"] {
        display: none;
      }

      .upload-btn {
        background-color: var(--primary);
        color: white;
        padding: 0.75rem 1.5rem;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 600;
        transition: background 0.2s;
      }

      .upload-btn:hover {
        background-color: var(--primary-hover);
      }

      #progress-container {
        margin-top: 1.5rem;
      }

      #progress-bar {
        height: 8px;
        background-color: var(--primary);
        width: 0%;
        border-radius: 4px;
        transition: width 0.2s;
        margin: 0 auto 0.5rem auto;
        max-width: 300px;
      }

      .controls {
        display: flex;
        gap: 1.5rem;
        padding: 1rem;
        background: var(--bg-color);
        border-radius: 6px;
        margin-bottom: 1rem;
        align-items: center;
      }

      .filter-group {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      select {
        padding: 0.5rem;
        border: 1px solid var(--border);
        border-radius: 4px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 1rem;
      }

      th, td {
        padding: 0.75rem;
        text-align: left;
        border-bottom: 1px solid var(--border);
      }

      th {
        background-color: var(--bg-color);
        font-weight: 600;
      }

      .hidden {
        display: none !important;
      }

      .error-text {
        color: #dc2626;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>PDF Drawing Analyzer</h1>
        <p>Process hundreds of drawings locally. No files are uploaded to any server.</p>
      </header>

      <section class="upload-section">
        <input type="file" id="file-input" multiple accept="application/pdf" />
        <label for="file-input" class="upload-btn">Select PDF Files</label>
        <div id="progress-container" class="hidden">
          <div id="progress-bar"></div>
          <span id="progress-text">Processing 0/0 files...</span>
        </div>
      </section>

      <section class="controls hidden" id="controls-section">
        <div class="filter-group">
          <label for="filter-page-size">Page Size Group:</label>
          <select id="filter-page-size">
            <option value="ALL">All Sizes</option>
            <option value="A0">A0</option>
            <option value="A1">A1</option>
            <option value="A2">A2</option>
            <option value="A3">A3</option>
            <option value="A4">A4</option>
            <option value="NON-STANDARD">Non-Standard / Custom</option>
          </select>
        </div>
        <div class="filter-group">
          <label for="filter-file-size">Max File Size:</label>
          <select id="filter-file-size">
            <option value="ALL">Any Size</option>
            <option value="1">Under 1 MB</option>
            <option value="5">Under 5 MB</option>
            <option value="10">Under 10 MB</option>
          </select>
        </div>
        <div class="summary" id="results-summary">Showing 0 files</div>
      </section>

      <section class="results">
        <table id="results-table" class="hidden">
          <thead>
            <tr>
              <th>File Name</th>
              <th>File Size</th>
              <th>Dimensions (mm)</th>
              <th>Drawing Size</th>
            </tr>
          </thead>
          <tbody id="results-body">
            <!-- Results populated via JS -->
          </tbody>
        </table>
      </section>
    </div>

    <script type="module">
      // Import the library directly from a CDN - no build step required
      import { PDFDocument } from 'https://cdn.jsdelivr.net/npm/pdf-lib@1.17.5/+esm';

      let allFilesData = [];

      const fileInput = document.getElementById('file-input');
      const progressContainer = document.getElementById('progress-container');
      const progressBar = document.getElementById('progress-bar');
      const progressText = document.getElementById('progress-text');
      const controlsSection = document.getElementById('controls-section');
      const resultsTable = document.getElementById('results-table');
      const resultsBody = document.getElementById('results-body');
      const resultsSummary = document.getElementById('results-summary');

      const filterPageSize = document.getElementById('filter-page-size');
      const filterFileSize = document.getElementById('filter-file-size');

      fileInput.addEventListener('change', handleFilesUpload);
      filterPageSize.addEventListener('change', renderTable);
      filterFileSize.addEventListener('change', renderTable);

      async function handleFilesUpload(event) {
        const target = event.target;
        if (!target.files || target.files.length === 0) return;

        const files = Array.from(target.files);
        console.log(`Starting process for ${files.length} files...`);
        
        allFilesData = [];
        
        progressContainer.classList.remove('hidden');
        controlsSection.classList.add('hidden');
        resultsTable.classList.add('hidden');
        resultsBody.innerHTML = '';

        for (let i = 0; i < files.length; i++) {
          const file = files[i];
          
          const percent = Math.round(((i + 1) / files.length) * 100);
          progressBar.style.width = `${percent}%`;
          progressText.textContent = `Processing ${i + 1} / ${files.length} files...`;

          await new Promise(resolve => setTimeout(resolve, 15));

          try {
            const data = await processSinglePdf(file);
            allFilesData.push(data);
          } catch (error) {
            console.error(`Error reading ${file.name}:`, error);
            allFilesData.push({
              name: file.name,
              sizeBytes: file.size,
              sizeString: formatBytes(file.size),
              widthMm: 0,
              heightMm: 0,
              drawingSize: 'ERROR',
              error: 'Failed to read PDF'
            });
          }
        }

        target.value = '';

        progressContainer.classList.add('hidden');
        controlsSection.classList.remove('hidden');
        resultsTable.classList.remove('hidden');
        renderTable();
      }

      async function processSinglePdf(file) {
        const arrayBuffer = await file.arrayBuffer();
        
        const pdfDoc = await PDFDocument.load(arrayBuffer, { ignoreEncryption: true });
        
        const page = pdfDoc.getPage(0);
        const { width, height } = page.getSize(); 

        const ptToMm = 0.352778;
        const widthMm = Math.round(width * ptToMm);
        const heightMm = Math.round(height * ptToMm);

        const drawingSize = classifyDrawingSize(widthMm, heightMm);

        return {
          name: file.name,
          sizeBytes: file.size,
          sizeString: formatBytes(file.size),
          widthMm,
          heightMm,
          drawingSize
        };
      }

      function classifyDrawingSize(w, h) {
        const shortEdge = Math.min(w, h);
        const longEdge = Math.max(w, h);

        const isApprox = (val, target) => Math.abs(val - target) <= 5;

        if (isApprox(shortEdge, 841) && isApprox(longEdge, 1189)) return 'A0';
        if (isApprox(shortEdge, 594) && isApprox(longEdge, 841)) return 'A1';
        if (isApprox(shortEdge, 420) && isApprox(longEdge, 594)) return 'A2';
        if (isApprox(shortEdge, 297) && isApprox(longEdge, 420)) return 'A3';
        if (isApprox(shortEdge, 210) && isApprox(longEdge, 297)) return 'A4';

        return 'NON-STANDARD';
      }

      function formatBytes(bytes, decimals = 2) {
        if (bytes === 0) return '0 Bytes';
        const k = 1024;
        const dm = decimals < 0 ? 0 : decimals;
        const sizes = ['Bytes', 'KB', 'MB', 'GB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
      }

      function renderTable() {
        const pageSizeFilter = filterPageSize.value;
        const maxMbFilter = filterFileSize.value;

        const filteredData = allFilesData.filter(file => {
          if (pageSizeFilter !== 'ALL' && file.drawingSize !== pageSizeFilter) {
            return false;
          }
          if (maxMbFilter !== 'ALL') {
            const maxBytes = parseFloat(maxMbFilter) * 1024 * 1024;
            if (file.sizeBytes > maxBytes) return false;
          }
          return true;
        });

        resultsBody.innerHTML = '';

        filteredData.forEach(file => {
          const tr = document.createElement('tr');
          
          if (file.error) {
            tr.innerHTML = `
              <td>${file.name}</td>
              <td>${file.sizeString}</td>
              <td colspan="2" class="error-text">Error: ${file.error}</td>
            `;
          } else {
            tr.innerHTML = `
              <td>${file.name}</td>
              <td>${file.sizeString}</td>
              <td>${file.widthMm} x ${file.heightMm}</td>
              <td><strong>${file.drawingSize}</strong></td>
            `;
          }
          resultsBody.appendChild(tr);
        });

        resultsSummary.textContent = `Showing ${filteredData.length} of ${allFilesData.length} files`;
      }
    </script>
  </body>
</html>
